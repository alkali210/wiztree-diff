[package]
name = "wiztree-diff"
version = "0.1.0"
edition = "2021"
[lib]
name = "wiztree_diff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
csv = "1"
hashbrown = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
base64 = "0.22"
[dev-dependencies]
tempfile = "3"
